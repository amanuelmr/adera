# Render Blueprint — deploys the Adera API as a free Docker web service.
#
# Postgres is NOT defined here: Render's own free database expires, so
# DATABASE_URL points at an external Neon instance instead (set in the
# dashboard, see DEPLOY.md).
#
# Object storage stays off — STORAGE_ENABLED defaults to false, so the API
# runs without MinIO or any S3 bucket. Evidence uploads are the only feature
# that needs it; everything else works.

services:
  - type: web
    name: adera-api
    runtime: docker
    plan: free
    region: frankfurt # closest Render region to Addis Ababa
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: APP_ENV
        value: production

      # The distroless image has no shell, so the port cannot be interpolated
      # from Render's $PORT at runtime. Both are pinned to Render's default
      # instead, which keeps the listener and the health check in agreement.
      - key: PORT
        value: "10000"
      - key: HTTP_ADDR
        value: ":10000"

      # Neon connection string — set by hand in the dashboard, never committed.
      # Must include ?sslmode=require.
      - key: DATABASE_URL
        sync: false

      # Config rejects anything under 32 bytes in production. Confirm the
      # generated value clears that (see DEPLOY.md step 4).
      - key: JWT_SECRET
        generateValue: true

      - key: STORAGE_ENABLED
        value: "false"

      # Public origin for the web pages' canonical and share-preview URLs.
      - key: BASE_URL
        value: https://adera.amanuel.work

      # Everything below is optional and left unset (sync: false) until you
      # fill it in on the dashboard — each feature stays off while its
      # variables are empty. See DEPLOY.md step 4.

      # Email verification and password reset. Without SMTP_HOST, verification
      # returns 503 and a forgotten password cannot be reset.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_ADDRESS
        sync: false

      # Push. Upload the Firebase service-account JSON as a Render Secret File;
      # it's mounted at /etc/secrets/<filename>, which is what this points at.
      - key: FCM_CREDENTIALS_FILE
        sync: false

      # Version gate for GET /api/v1/app/version. Plain semver (1.2.0, no "v").
      - key: APP_ANDROID_MIN_VERSION
        sync: false
      - key: APP_ANDROID_LATEST_VERSION
        sync: false
      - key: APP_ANDROID_STORE_URL
        sync: false

      # Android App Links: the app signing certificate's SHA-256 fingerprint
      # (from EAS, see mobile/RELEASE.md), so /t/ and /r/ links open the app.
      # /.well-known/assetlinks.json returns 404 until it's set.
      - key: ANDROID_CERT_SHA256
        sync: false
