# Keeps the free Render instance awake during the hours anyone is likely to
# open the live API.
#
# Render free instances sleep after 15 minutes idle and take 30-50s to wake.
# Pinging around the clock would fix that but costs ~730 of the 750 free
# instance-hours per month — 97% of the whole workspace allowance on one
# service. Pinging only 05:00-21:00 UTC costs ~490 hours and leaves real
# headroom, while covering business hours across Europe, Africa and the US.
#
# Widen to "*/10 * * * *" for always-warm, but check Render's free-hours
# gauge first: the allowance is workspace-wide, not per service.
#
# Note: GitHub disables scheduled workflows after 60 days without repo
# activity. If the API starts sleeping again, check that this is still
# enabled under the Actions tab.

name: keepalive

on:
  schedule:
    - cron: "*/10 5-20 * * *"
  workflow_dispatch: # lets you wake it by hand from the Actions tab

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          # --max-time 90 rather than the default: a cold start legitimately
          # takes 30-50s, and that is exactly the case worth waiting out.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
                   --max-time 90 --retry 2 --retry-delay 15 \
                   https://adera.amanuel.work/health) || true

          echo "health -> ${code:-no response}"
          [ "$code" = "200" ] || { echo "::warning::health check returned ${code:-no response}"; exit 0; }
