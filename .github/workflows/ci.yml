name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default token can write to the repository; nothing here needs to.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: adera
          POSTGRES_PASSWORD: adera
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U adera"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://adera:adera@localhost:55432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test (race)
        run: go test -race ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # golangci-lint-action@v6 doesn't support golangci-lint v2 at all
          # ("you must update to golangci-lint-action v7") — v9 is the
          # action's current major and the README's own example pins v2.x
          # the same way. v2.14.0 is itself built with go1.26.6, so it can
          # analyze code declaring go1.26.6 in go.mod (v1.64.8, which
          # "latest" under @v6 resolved to, was built with go1.24 and
          # couldn't).
          version: v2.14.0

  web-pages:
    # Lighthouse budgets for the server-rendered pages (docs/frontend-handoff.md §5).
    # The logic lives in scripts/lighthouse.sh so it runs identically locally.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: adera
          POSTGRES_PASSWORD: adera
          POSTGRES_DB: lhci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U adera"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Lighthouse
        env:
          DATABASE_URL: postgres://adera:adera@localhost:55432/lhci?sslmode=disable
        run: scripts/lighthouse.sh
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: docker build -t adera-api:ci .
