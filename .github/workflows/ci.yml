name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: adera
          POSTGRES_PASSWORD: adera
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U adera"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://adera:adera@localhost:55432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test (race)
        run: go test -race ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint-action@v6 doesn't support golangci-lint v2 at all
          # ("you must update to golangci-lint-action v7") — v9 is the
          # action's current major and the README's own example pins v2.x
          # the same way. v2.14.0 is itself built with go1.26.6, so it can
          # analyze code declaring go1.26.6 in go.mod (v1.64.8, which
          # "latest" under @v6 resolved to, was built with go1.24 and
          # couldn't).
          version: v2.14.0

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t adera-api:ci .
