name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "api/openapi.yaml"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "api/openapi.yaml"
      - ".github/workflows/mobile-ci.yml"

# The default token can write to the repository; nothing here needs to.
permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Pinned rather than lts/*, which silently jumps majors when a new LTS lands.
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify the generated API client matches api/openapi.yaml
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Test
        run: npm test -- --ci
      - name: expo-doctor
        run: npx expo-doctor
