name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "api/openapi.yaml"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "api/openapi.yaml"
      - ".github/workflows/mobile-ci.yml"

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify the generated API client matches api/openapi.yaml
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: expo-doctor
        run: npx expo-doctor
