# Deliberately small, high-signal linter set; no style-noise rules.
version: "2"
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - misspell
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - noctx
  exclusions:
    rules:
      # Test helpers may ignore cleanup errors and skip context plumbing on
      # ad-hoc HTTP calls against an httptest.Server.
      - path: _test\.go
        linters: [errcheck, noctx]
