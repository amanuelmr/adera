# Deliberately small, high-signal linter set; no style-noise rules.
version: "2"
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - misspell
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - noctx
linters-settings: {}
issues:
  exclude-rules:
    # Test helpers may ignore cleanup errors.
    - path: _test\.go
      linters: [errcheck]
